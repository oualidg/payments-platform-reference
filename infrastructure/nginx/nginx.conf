# ==============================================================================
# Nginx Configuration -- Payments Platform API Gateway
#
# Responsibilities:
#   1.  Serve Angular static files (HTML, CSS, JS) on port 80
#   2.  Proxy /api/* requests to Utility Account Service on port 8080
#   3.  Handle Angular client-side routing (HTML5 pushState)
#   4.  Rate limiting -- protect against abuse and brute force
#   5.  Security headers -- harden HTTP responses
#   6.  Request size limiting -- reject oversized payloads early
#   7.  Correlation ID stamping -- trace requests across the system
#   8.  Timeout configuration -- prevent slow upstream connections
#   9.  Gzip compression -- reduce bandwidth and improve load times
#  10.  Static asset caching -- leverage Angular content hashes
#  11.  M-Pesa callback routing -- dedicated vhost for Safaricom C2B callbacks
#  12.  Swagger UI -- proxied to utility-account:8080
#
# Architecture:
#   Browser -> Nginx (port 80)
#               +-- utility.oualidg.dev
#               |     +-- /api/*             -> utility-account (port 8080, internal only)
#               |     +-- /swagger-ui*       -> utility-account (port 8080)
#               |     +-- /v3/api-docs*      -> utility-account (port 8080)
#               |     +-- /*                 -> Angular static files
#               +-- mpesa.oualidg.dev
#                     +-- /swagger-ui*         -> mpesa-gateway (port 8081)
#                     +-- /v3/api-docs*        -> mpesa-gateway (port 8081)
#                     +-- /api/v1/validation   -> mpesa-gateway (port 8081, internal only)
#                     +-- /api/v1/confirmation -> mpesa-gateway (port 8081, internal only)
#               +-- grafana.oualidg.dev
#                     +-- /*               -> grafana (port 3000)
#
# Deployment:
#   All services run on a single Ubuntu host under /opt/payments/.
#   Nginx logs -> /opt/payments/logs/nginx/
# ==============================================================================

events {
    worker_connections 1024;
}

http {

    # --------------------------------------------------------------------------
    # Rate Limiting Zones
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=20r/s;
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=mpesa_limit:10m  rate=100r/s;

    # --------------------------------------------------------------------------
    # M-Pesa Callback IP Allowlist
    #
    # Currently open (1 = allow all) for development and k6 load testing.
    # Before Safaricom production go-live, replace with the specific IPs
    # from https://developer.safaricom.co.ke and remove the 0.0.0.0/0 entry.
    #
    # OPERATIONAL NOTE: Safaricom may add or change IPs without notice.
    # Verify the allowlist after any callback delivery failures.
    #
    # Production IPs (for reference -- not yet active):
    #   196.201.214.200  196.201.214.206  196.201.214.207  196.201.214.208
    #   196.201.213.114  196.201.213.44   196.201.212.127  196.201.212.138
    #   196.201.212.129  196.201.212.136  196.201.212.74   196.201.212.69
    # --------------------------------------------------------------------------
    geo $safaricom_callback {
        default     0;
        0.0.0.0/0   1;
    }

    server_tokens off;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10M;

    # Global proxy timeouts -- overridden at location level in mpesa.oualidg.dev
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # --------------------------------------------------------------------------
    # Log Format
    # Includes correlation ID for end-to-end tracing.
    # Logs written to /opt/payments/logs/nginx/ via Docker volume mount.
    # --------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'corr="$request_id" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ==========================================================================
    # Virtual Host: utility.oualidg.dev
    # ==========================================================================
    server {
        listen 80;
        server_name utility.oualidg.dev;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options          "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options   "nosniff"                         always;
        add_header X-XSS-Protection         "1; mode=block"                   always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;

        # --------------------------------------------------------------------------
        # Swagger UI and OpenAPI docs -- public, proxied to utility-account:8080
        # --------------------------------------------------------------------------
        location ^~ /swagger-ui {
            proxy_pass http://utility-account:8080/swagger-ui;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location ^~ /v3/api-docs {
            proxy_pass http://utility-account:8080/v3/api-docs;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # --------------------------------------------------------------------------
        # API Reverse Proxy -> utility-account:8080
        # --------------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20;
            limit_req_status 429;

            proxy_pass http://utility-account:8080/api/;

            proxy_set_header X-Correlation-ID  $request_id;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # No caching for index.html
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Angular HTML5 PushState routing
        location / {
            limit_req zone=static_limit burst=50 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # Aggressive caching for hashed static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            limit_req zone=static_limit burst=50 nodelay;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Block hidden files
        location ~ /\. {
            deny all;
            return 404;
        }
    }

    # ==========================================================================
    # Virtual Host: mpesa.oualidg.dev
    # Dedicated entry point for Safaricom C2B callbacks.
    #
    # Security:
    #   - IP allowlist via $safaricom_callback (open for dev, restrict for prod)
    #   - Secret token validated by CallbackTokenFilter in the Gateway
    #   - No UI, no admin, no static files on this vhost
    #
    # Timeouts: overridden per location to honour Safaricom 8s SLA
    # ==========================================================================
    server {
        listen 80;
        server_name mpesa.oualidg.dev;

        client_max_body_size 1M;

        # --------------------------------------------------------------------------
        # Swagger UI and OpenAPI docs -- public, proxied to mpesa-gateway:8081
        # --------------------------------------------------------------------------
        location ^~ /swagger-ui {
            proxy_pass http://mpesa-gateway:8081/swagger-ui;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location ^~ /v3/api-docs {
            proxy_pass http://mpesa-gateway:8081/v3/api-docs;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # --------------------------------------------------------------------------
        # Validation Callback -- synchronous, must respond within 8s SLA
        # --------------------------------------------------------------------------
        location = /api/v1/validation {

            if ($safaricom_callback = 0) {
                return 403;
            }

            limit_req zone=mpesa_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_connect_timeout 1s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;

            proxy_pass http://mpesa-gateway:8081/api/v1/validation;

            proxy_set_header X-Correlation-ID  $request_id;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # --------------------------------------------------------------------------
        # Confirmation Callback -- acknowledged immediately after durable persistence
        # --------------------------------------------------------------------------
        location = /api/v1/confirmation {

            if ($safaricom_callback = 0) {
                return 403;
            }

            limit_req zone=mpesa_limit burst=50 nodelay;
            limit_req_status 429;

            proxy_connect_timeout 1s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;

            proxy_pass http://mpesa-gateway:8081/api/v1/confirmation;

            proxy_set_header X-Correlation-ID  $request_id;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Block everything else on this vhost
        location / {
            return 404;
        }
    }

    # ==========================================================================
    # Virtual Host: grafana.oualidg.dev
    # ==========================================================================
    server {
        listen 80;
        server_name grafana.oualidg.dev;

        location / {
            proxy_pass http://grafana:3000/;

            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host              $host;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

}